<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>メンバー紹介 - DORUDO SERVER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ==========================================================================
           ベースデザイン：プレミアム・ホワイトUI
           ========================================================================== */
        body { margin: 0; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif; background: #f4f7fc; padding-top: 80px; color: #0f172a; touch-action: manipulation; line-height: 1.7; letter-spacing: 0.04em; }
        
        /* ヘッダー */
        .header-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid #0284c7; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 1000; }
        .menu-btn { font-size: 20px; cursor: pointer; width: 40px; color: #0284c7; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 14px; text-decoration: none; color: #0f172a; letter-spacing: 2px; }

        /* サイドメニュー */
        .side-menu { position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background: #ffffff; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; padding-top: 60px; border-right: 2px solid #0284c7; }
        .side-menu.open { transform: translateX(260px); }
        .side-menu a { display: block; padding: 16px 28px; color: #334155; text-decoration: none; font-size: 13px; font-weight: 600; border-bottom: 1px solid rgba(0,0,0,0.04); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.2); display: none; z-index: 1500; backdrop-filter: blur(4px); }
        .overlay.show { display: block; }

        /* コンテンツエリア */
        .container { width: 90%; max-width: 440px; margin: 0 auto; padding-bottom: 50px; }
        h1 { font-size: 18px; font-weight: 900; text-align: center; margin-bottom: 35px; color: #0f172a; letter-spacing: 2px; }
        
        .section-card { background: #ffffff; padding: 24px; border: 1px solid rgba(2, 132, 199, 0.2); border-left: 4px solid #0284c7; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04); margin-bottom: 24px; }
        
        .member-item { display: flex; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
        .member-item:last-child { border-bottom: none; }
        .icon { width: 44px; height: 44px; border-radius: 12px; background: #f1f5f9; margin-right: 16px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #94a3b8; }
        .role { font-size: 11px; color: #0284c7; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        .name { font-weight: 900; font-size: 15px; color: #0f172a; margin-top: 2px; }

        .back-link { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin: 20px 0 40px 0; color: #64748b; text-decoration: none; font-size: 13px; font-weight: 700; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

        <a href="Admin.html">管理者パネル</a>
    </div>

    <div class="header-bar">

    </div>

    <div class="container">

        <div class="section-card">
            <div class="member-item">
                <div class="icon"><i class="fa-solid fa-crown"></i></div>
                <div>
                    <div class="role">オーナー/管理者/鯖主</div>
                    <div class="name">DORUDO(dorudo2283)</div>
                </div>
            </div>
            <div class="member-item">
                <div class="icon"><i class="fa-solid fa-user-gear"></i></div>
                <div>
                    <div class="role">人事対応/コマンド/お手伝い</div>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> トップに戻る</a>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }
    </script>
</body>
</html>
