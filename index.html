<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DORUDO SERVER 公式</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ==========================================================================
       ベースデザイン：スマホで映える、精密な固定装飾【近未来・白スクエア】UI
       ========================================================================== */
    body { 
      margin: 0; 
      font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif; 
      background: #f4f7fc; 
      padding-top: 60px; 
      color: #0f172a; 
      touch-action: manipulation; 
      letter-spacing: 0.04em;
    }
    
    /* ヘッダー：2重の境界線で精密感を演出 */
    .header-bar { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 60px; 
      background: rgba(255, 255, 255, 0.9); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #0284c7; /* クッキリとしたメイン線 */
      color: #0f172a; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 20px; 
      box-sizing: border-box; 
      z-index: 1000; 
    }
    /* ヘッダーの下に走るもう1本の薄い装飾線（2重構造） */
    .header-bar::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(2, 132, 199, 0.2);
    }
    .menu-btn { font-size: 20px; cursor: pointer; width: 40px; color: #0284c7; }
    .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 14px; text-decoration: none; color: #0f172a; white-space: nowrap; letter-spacing: 2px; }
    
    /* サイドメニュー */
    .side-menu { position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background: #ffffff; color: #0f172a; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; padding-top: 60px; box-sizing: border-box; border-right: 2px solid #0284c7; }
    .side-menu.open { transform: translateX(260px); }
    .side-menu a { display: block; padding: 16px 28px; color: #334155; text-decoration: none; font-size: 13px; font-weight: 600; border-bottom: 1px solid rgba(0,0,0,0.04); }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.2); display: none; z-index: 1500; backdrop-filter: blur(4px); }
    .overlay.show { display: block; }

    /* ヒーローセクション */
    .hero-container {
        position: relative;
        width: 100%;
        height: 220px;
        overflow: hidden;
        display: block;
        background: #f4f7fc;
    }
    .hero-container::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background: linear-gradient(to top, #f4f7fc, transparent);
    }
    .hero-image { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
    
    /* コンテンツエリア */
    .container { width: 90%; max-width: 440px; margin: 20px auto 40px auto; text-align: center; box-sizing: border-box; }
    .sub-text { color: #475569; margin-bottom: 35px; font-size: 11px; line-height: 1.8; font-weight: 600; letter-spacing: 1px; }
    
    /* 🛠️ 見出しの装飾：インデックス[01]とドット線の組み合わせ */
    .group-title { 
      text-align: left; 
      font-size: 12px; 
      font-weight: 900; 
      color: #0284c7; 
      margin: 40px 0 14px 0; 
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* 見出しの前につくゲームUI風のインデックス */
    .group-title::before {
      content: attr(data-index);
      font-size: 9px;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(2, 132, 199, 0.08);
      padding: 2px 6px;
      border: 1px solid rgba(2, 132, 199, 0.2);
    }
    .group-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(2, 132, 199, 0.3), transparent);
    }
    
    /* ⚡ ボタン基本設定：完全四角形 ＆ 左側のアクティブバー装飾 */
    .button { 
        display: flex; 
        align-items: center; 
        justify-content: flex-start; /* 左寄せにして安定感を出す */
        background: #ffffff; 
        color: #334155; 
        text-decoration: none; 
        padding: 16px 20px; 
        margin-bottom: 12px; 
        border: 1px solid rgba(2, 132, 199, 0.2); 
        border-left: 4px solid #0284c7; /* ★左側の固定カラーバー装飾 */
        border-radius: 0px; 
        font-size: 13px; 
        font-weight: 700; 
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        box-sizing: border-box; 
        width: 100%; 
        position: relative;
    }
    /* ボタンの右端につく矢印アイコン（固定装飾） */
    .button::after {
        content: '▶';
        position: absolute;
        right: 20px;
        font-size: 9px;
        color: #94a3b8;
    }
    
    /* スマホでのタップ時のフィードバック（一瞬沈む） */
    .button:active { 
        background: #f8fafc;
        border-left-color: #0ea5e9;
    }

    /* 🔥 [最重要ボタン] 認証コード発行（反転カラーで高級感を出す） */
    .btn-main { 
        background: #0284c7; 
        color: #ffffff; 
        border: 1px solid #0284c7; 
        border-left: 4px solid #0f172a; /* ここだけアクセントに黒のライン */
        font-weight: 800;
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }
    .btn-main::after { color: rgba(255, 255, 255, 0.6); }
    .btn-main:active { background: #0ea5e9; }
    
    /* グリッド配置 */
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .btn-grid .button { font-size: 12px; padding: 16px 12px; margin-bottom: 0; }
    /* グリッド内は右矢印を消してすっきりさせる */
    .btn-grid .button::after { display: none; }
    
    footer { text-align: center; padding: 60px 0 40px 0; color: #94a3b8; font-size: 10px; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div id="overlay" class="overlay" onclick="toggleMenu()"></div>
  <div id="sideMenu" class="side-menu">
    <a href="index.html">トップ</a>
    <a href="updates.html">アプデ情報</a>
    <a href="Num.html">認証コード発行</a>
    <a href="access.html">鯖の入り方・情報</a>
    <a href="rules.html">ルール</a>
    <a href="Q.html">よくある質問</a>
    <a href="GofList.html">ワールド一覧</a>
    <a href="members.html">メンバー紹介</a>
    <a href="Admin.html">管理者パネル</a>
  </div>

  <div class="header-bar">
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <a href="index.html" class="header-title">DORUDO SERVER</a>
    <div style="width: 40px;"></div>
  </div>

  <div class="hero-container">
    <img src="Top.png" alt="DORUDO SERVER" class="hero-image">
  </div>

  <div class="container">
    <p class="sub-text">マイクラ統合版 参加型サーバー<br>ドル鯖公式ホームページへようこそ</p>

    <!-- data-index に入れた文字が自動的に装飾として見出しの横に表示されます -->
    <div class="group-title" data-index="01">サーバーに参加する</div>
    <a href="Num.html" class="button btn-main">認証コード発行</a>
    <a href="access.html" class="button">サーバーの入り方・情報</a>

    <div class="group-title" data-index="02">最新情報</div>
    <a href="updates.html" class="button">アプデ情報を確認する</a>

    <div class="group-title" data-index="03">運営・管理</div>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSe2fkIo2BZdX3afLDcCgVmeSSwmZ5_iHbcPOMcQ9WnQ_yqqyw/viewform?usp=dialog" class="button" target="_blank">
       運営募集フォームを開く
    </a>

    <div class="group-title" data-index="04">各種情報</div>
    <div class="btn-grid">
      <a href="rules.html" class="button">ルール・規約</a>
      <a href="Q.html" class="button">よくある質問</a>
    </div>
    <a href="https://forms.gle/CMHnTxxfY1umVRrY6" class="button" target="_blank">報告・意見を送る</a>
    <a href="GofList.html" class="button">公開ワールド一覧・攻略</a>

    <div class="group-title" data-index="05">コミュニティ</div>
    <div class="btn-grid">
      <a href="members.html" class="button">メンバー紹介</a>
      <a href="addons.html" class="button">アドオン紹介</a>
    </div>
    <div class="btn-grid">
      <a href="Links.html" class="button">リンク集</a>
      <a href="credit.html" class="button">クレジット</a>
    </div>
  </div>

  <footer>
    <p>©2026 DORUDO SERVER Official Website</p>
  </footer>

  <script>
    function toggleMenu() {
      const sideMenu = document.getElementById('sideMenu');
      const overlay = document.getElementById('overlay');
      sideMenu.classList.toggle('open');
      overlay.classList.toggle('show');
    }
  </script>
</body>
</html>
