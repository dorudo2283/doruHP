<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理者パネル - DORUDO SERVER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            margin: 0; 
            font-family: -apple-system, "SF Pro Display", sans-serif; 
            background: #f4f7fc; 
            padding-top: 80px; 
            color: #0f172a; 
            touch-action: manipulation;
        }
        
        /* ⚡ 爆速サイドメニュー & ヘッダー（完全同期） */
        .header-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid #0284c7; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 1000; }
        .menu-btn { font-size: 20px; cursor: pointer; color: #0284c7; width: 40px; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 14px; text-decoration: none; color: #0f172a; letter-spacing: 2px; }
        
        .side-menu { 
            position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background: #ffffff; 
            z-index: 2000; padding-top: 60px; border-right: 2px solid #0284c7; box-sizing: border-box;
            will-change: transform;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .side-menu.open { transform: translateX(260px); }
        .side-menu a { display: block; padding: 16px 28px; color: #334155; text-decoration: none; font-size: 13px; font-weight: 600; border-bottom: 1px solid #f1f5f9; text-align: left; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.2); display: none; z-index: 1500; backdrop-filter: blur(4px); }
        .overlay.show { display: block; }
        
        /* コンテンツエリア */
        .container { width: 90%; max-width: 440px; margin: 0 auto; padding-bottom: 50px; box-sizing: border-box; }
        h1 { font-size: 22px; font-weight: 900; margin-bottom: 25px; text-align: center; letter-spacing: 1px; }
        
        /* カードデザイン */
        .section-card { 
            background: white; 
            padding: 30px 20px; 
            border-radius: 0px; 
            border: 1px solid rgba(2, 132, 199, 0.2);
            border-top: 4px solid #0f172a;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.02); 
            margin-bottom: 25px; 
            box-sizing: border-box; 
        }
        .section-card h2 { font-size: 15px; margin: 0 0 20px 0; color: #0f172a; font-weight: 900; letter-spacing: 0.5px; }
        
        /* 入力フォーム（ドル鯖ホワイト仕様） */
        .input-style { 
            width: 100%; 
            padding: 14px; 
            border-radius: 6px; 
            border: 1px solid #cbd5e1; 
            background: #f8fafc; 
            margin-bottom: 16px; 
            box-sizing: border-box; 
            font-size: 16px; 
            text-align: center; 
            font-weight: 600; 
            color: #0f172a;
            transition: all 0.2s; 
        }
        .input-style:focus { background: #fff; border-color: #0284c7; outline: none; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
        
        /* ボタン設定 */
        .btn-admin { 
            width: 100%; 
            padding: 14px; 
            border-radius: 6px; 
            border: none; 
            background: #0284c7; 
            color: white; 
            font-weight: 800; 
            font-size: 14px; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
            transition: background 0.2s; 
        }
        .btn-admin:active { background: #0ea5e9; }
        
        #loginSection { display: block; }
        #adminContent { display: none; }
        
        /* ステータスボックス表示 */
        .result-box { margin-top: 20px; font-size: 13px; font-weight: 700; padding: 14px; border-radius: 6px; border: 1px solid transparent; text-align: center; }
        .status-waiting { color: #64748b; background: #f1f5f9; border-color: #e2e8f0; }
        .status-success { color: #0284c7; background: #f0f7ff; border-color: #bae6fd; border-left: 4px solid #0284c7; border-radius: 0 6px 6px 0; }
        .status-error { color: #ef4444; background: #fef2f2; border-color: #fee2e2; border-left: 4px solid #ef4444; border-radius: 0 6px 6px 0; }

        .back-link { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; text-align: center; margin: 30px 0; color: #64748b; text-decoration: none; font-size: 13px; font-weight: 700; }
        .back-link:active { color: #0284c7; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>
    <div id="sideMenu" class="side-menu">
        <a href="index.html">トップ</a>
        <a href="updates.html">アプデ情報</a>
        <a href="Num.html">認証コード発行</a>
        <a href="access.html">鯖の入り方・情報</a>
        <a href="rules.html">ルール</a>
        <a href="Q.html">よくある質問</a>
        <a href="GofList.html">ワールド一覧</a>
        <a href="members.html">メンバー紹介</a>
        <a href="Admin.html">管理者パネル</a>
    </div>

    <div class="header-bar">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <a href="index.html" class="header-title">DORUDO SERVER</a>
        <div style="width: 40px;"></div>
    </div>

    <div class="container">
        <h1>管理者パネル</h1>

        <div id="loginSection" class="section-card">
            <h2>管理者ページへログイン</h2>
            <input type="password" id="adminPass" class="input-style" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter') checkLogin()">
            <button class="btn-admin" onclick="checkLogin()">ログイン</button>
        </div>

        <div id="adminContent" class="section-card">
            <h2>認証コード確認</h2>
            <input type="text" id="checkInput" class="input-style" placeholder="000-000" maxlength="7" oninput="validateMatrix6Code()">
            <div id="resultDisplay" class="result-box status-waiting">コードの入力待ち...</div>
        </div>
        
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> トップに戻る</a>
    </div>

    <script>
        function toggleMenu() {
            const sideMenu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            const isOpen = sideMenu.classList.toggle('open');
            overlay.classList.toggle('show', isOpen);
        }

        const ADMIN_PASSWORD = "dorugy";

        function checkLogin() {
            if (document.getElementById('adminPass').value === ADMIN_PASSWORD) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
            } else { 
                alert("パスワードが違います"); 
            }
        }
        
        function validateMatrix6Code() {
            const input = document.getElementById('checkInput').value.trim();
            const result = document.getElementById('resultDisplay');

            if (input.length === 0) {
                result.innerText = "コードの入力待ち...";
                result.className = "result-box status-waiting";
                return;
            }

            const regex = /^([0-9]{3})-([0-9]{3})$/;
            const match = input.match(regex);

            if (match) {
                const head = match[1];
                const tail = match[2];

                const n1 = parseInt(head[0]);
                const n2 = parseInt(head[1]);
                const n3 = parseInt(head[2]);

                const t1 = parseInt(tail[0]);
                const t2 = parseInt(tail[1]);
                const t3 = parseInt(tail[2]);

                const check1 = (n1 + n2) % 10 === t1;
                const check2 = (n2 + n3) % 10 === t2;
                const check3 = (t1 + t2 + n3) % 10 === t3;

                if (check1 && check2 && check3) {
                    result.innerText = "認証可（コード一致：本物）";
                    result.className = "result-box status-success";
                    return;
                }
            }
            
            result.innerText = "認証不可（不正なコード）";
            result.className = "result-box status-error";
        }
    </script>
</body>
</html>
