<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>リンク集 - DORUDO SERVER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ==========================================================================
           ベースデザイン：サイト全体と完全同期する【プレミアム・ホワイト】UI
           ========================================================================== */
        body { 
            margin: 0; 
            font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif; 
            background: #f4f7fc; 
            padding-top: 80px; 
            color: #0f172a; 
            touch-action: manipulation;
            letter-spacing: 0.04em;
        }
        
        /* ヘッダー */
        .header-bar { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 60px; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid #0284c7; 
            color: #0f172a; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 20px; 
            box-sizing: border-box; 
            z-index: 1000; 
        }
        .header-bar::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(2, 132, 199, 0.2);
        }
        .menu-btn { font-size: 20px; cursor: pointer; width: 40px; color: #0284c7; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 14px; text-decoration: none; color: #0f172a; white-space: nowrap; letter-spacing: 2px; }

        /* サイドメニュー */
        .side-menu { position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background: #ffffff; color: #0f172a; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; padding-top: 60px; box-sizing: border-box; border-right: 2px solid #0284c7; }
        .side-menu.open { transform: translateX(260px); }
        .side-menu a { display: block; padding: 16px 28px; color: #334155; text-decoration: none; font-size: 13px; font-weight: 600; border-bottom: 1px solid rgba(0,0,0,0.04); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.2); display: none; z-index: 1500; backdrop-filter: blur(4px); }
        .overlay.show { display: block; }

        /* コンテンツエリア */
        .container { width: 90%; max-width: 440px; margin: 0 auto; box-sizing: border-box; }
        
        /* ページタイトル */
        h1 { 
            font-size: 18px; 
            font-weight: 900; 
            text-align: center; 
            margin-bottom: 35px; 
            color: #0f172a; 
            letter-spacing: 2px;
        }
        
        /* リンクボタンのデザイン（徹底したフラットスクエア） */
        .link-btn {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid rgba(2, 132, 199, 0.2);
            padding: 14px;
            margin-bottom: 12px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.02);
            transition: all 0.2s;
            position: relative;
        }
        .link-btn:active {
            background: #f8fafc;
            border-color: #0284c7;
        }

        /* アイコン画像（洗練されたシャープな正方形） */
        .link-icon {
            width: 48px;
            height: 48px;
            object-fit: cover;
            margin-right: 14px;
            flex-shrink: 0;
            background: #f1f5f9;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* テキストエリア */
        .link-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-right: 24px; /* 右側の矢印アイコンと被らないための余白 */
        }
        .link-name {
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
            transition: color 0.2s;
        }
        .link-btn:active .link-name {
            color: #0284c7;
        }
        .link-url {
            font-size: 11px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        /* 外部リンクを示す矢印アイコン（視覚的手がかり） */
        .link-arrow {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 12px;
            transition: color 0.2s;
        }
        .link-btn:active .link-arrow {
            color: #0284c7;
        }

        /* 戻るリンク */
        .back-link { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            text-align: center; 
            margin: 30px 0 60px 0; 
            color: #64748b; 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: 700;
            transition: color 0.2s;
        }
        .back-link:active { color: #0284c7; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>
    <div id="sideMenu" class="side-menu">
        <a href="index.html">トップ</a>
        <a href="updates.html">アプデ情報</a>
        <a href="Num.html">認証コード発行</a>
        <a href="access.html">鯖の入り方・情報</a>
        <a href="rules.html">ルール</a>
        <a href="Q.html">よくある質問</a>
        <a href="GofList.html">ワールド一覧</a>
        <a href="members.html">メンバー紹介</a>
        <a href="Admin.html">管理者パネル</a>
    </div>

    <div class="header-bar">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <a href="index.html" class="header-title">DORUDO SERVER</a>
        <div style="width: 40px;"></div>
    </div>

    <div class="container">
        <h1>リンク集</h1>

        <a href="https://dorudo2283.github.io/doruHP/" class="link-btn" target="_blank" rel="noopener noreferrer">
            <img src="DORU.png" alt="HP" class="link-icon">
            <div class="link-info">
                <span class="link-name">ドル鯖公式HP</span>
                <span class="link-url">https://dorudo2283.github.io/doruHP/</span>
            </div>
            <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
        </a>

        <a href="https://minecraft-mcworld.com/author/93dc31d6bf445963824dcf200048ef2bfb6f5303/" class="link-btn" target="_blank" rel="noopener noreferrer">
            <img src="Colony.png" alt="Colony" class="link-icon">
            <div class="link-info">
                <span class="link-name">クラフターズコロニー</span>
                <span class="link-url">https://minecraft-mcworld.com/author/93dc31d6bf445963824dcf200048ef2bfb6f5303/</span>
            </div>
            <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
        </a>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> トップに戻る</a>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }
    </script>
</body>
</html>
