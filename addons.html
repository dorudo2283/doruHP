<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>導入アドオン一覧 - DORUDO SERVER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* 共通スタイル */
        body { margin: 0; font-family: -apple-system, sans-serif; background: #f4f7fc; padding-top: 80px; color: #0f172a; }
        .header-bar { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); border-bottom: 1px solid #0284c7; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 1000; }
        .menu-btn { font-size: 20px; cursor: pointer; color: #0284c7; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 14px; text-decoration: none; color: #0f172a; letter-spacing: 2px; }
        
        .container { width: 90%; max-width: 440px; margin: 0 auto; padding-bottom: 50px; }
        
        /* 検索バー */
        #searchInput { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        
        /* アドオンカード */
        .addon-card { background: white; padding: 20px; border-radius: 8px; border: 1px solid rgba(2, 132, 199, 0.2); margin-bottom: 16px; transition: 0.2s; }
        .category-tag { font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 4px; color: white; margin-bottom: 8px; display: inline-block; }
        .cat-self { background: #0284c7; }
        .cat-ext { background: #64748b; }
        .addon-title { font-size: 16px; font-weight: 900; margin: 0 0 8px 0; }
        .addon-tags { font-size: 11px; color: #0284c7; margin-bottom: 8px; font-weight: 700; }
        .addon-desc { font-size: 13px; color: #334155; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <a href="index.html" class="header-title">DORUDO SERVER</a>
    </div>

    <div class="container">
        <h1>導入アドオン</h1>
        <input type="text" id="searchInput" placeholder="アドオン名で検索..." onkeyup="filterAddons()">

        <div id="addonList">
            <div class="addon-card" data-name="独自通貨アドオン">
                <span class="category-tag cat-self">自作</span>
                <div class="addon-title">独自通貨アドオン</div>
                <div class="addon-tags">#経済 #システム #コア</div>
                <div class="addon-desc">サーバー内の取引に使用する通貨を管理・運用します。</div>
            </div>

            <div class="addon-card" data-name="家具追加アドオン">
                <span class="category-tag cat-ext">外部</span>
                <div class="addon-title">家具追加アドオン</div>
                <div class="addon-tags">#建築 #装飾</div>
                <div class="addon-desc">建築の幅を広げる多種多様な家具を追加します。</div>
            </div>
        </div>
    </div>

    <script>
        function filterAddons() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('addon-card');
            for (let card of cards) {
                let name = card.getAttribute('data-name').toLowerCase();
                card.style.display = name.includes(input) ? "" : "none";
            }
        }
        function toggleMenu() { /* 既存のメニュー処理 */ }
    </script>
</body>
</html>
